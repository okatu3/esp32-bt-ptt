<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 800" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="15">
  <rect width="920" height="800" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">BT-PTT ⇔ ICOM ID-31 接続図(推奨構成)</text>

  <!-- AudioKit box -->
  <rect x="20" y="60" width="210" height="460" rx="8" fill="#eef4ff" stroke="#3366aa" stroke-width="2"/>
  <text x="125" y="84" text-anchor="middle" font-weight="bold" fill="#224">A1S AudioKit V2.2</text>
  <text x="220" y="125" text-anchor="end" fill="#111">PHONE 出力 (Tip/L)</text>
  <text x="220" y="295" text-anchor="end" fill="#111">IO19 (PTT)</text>
  <text x="220" y="405" text-anchor="end" fill="#111">LINE IN (Tip/L)</text>
  <text x="220" y="495" text-anchor="end" fill="#111">GND</text>

  <!-- ID-31 box -->
  <rect x="700" y="60" width="200" height="460" rx="8" fill="#fff4ea" stroke="#aa6633" stroke-width="2"/>
  <text x="800" y="84" text-anchor="middle" font-weight="bold" fill="#422">ICOM ID-31</text>
  <text x="712" y="205" fill="#111">MIC/PTT</text>
  <text x="712" y="405" fill="#111">SP (受信音声)</text>
  <text x="712" y="495" fill="#111">GND</text>

  <g stroke="#111" stroke-width="2" fill="none">
    <!-- TX audio: PHONE -> R1 10k -> node N -> C1 1uF -> node B -> MIC/PTT -->
    <line x1="230" y1="120" x2="290" y2="120"/>
    <polyline points="290,120 295,108 305,132 315,108 325,132 335,108 345,132 350,120"/>
    <line x1="350" y1="120" x2="500" y2="120"/>
    <line x1="500" y1="102" x2="500" y2="138"/>
    <line x1="512" y1="102" x2="512" y2="138"/>
    <line x1="512" y1="120" x2="580" y2="120"/>
    <line x1="580" y1="120" x2="580" y2="200"/>
    <line x1="580" y1="200" x2="700" y2="200"/>

    <!-- R2 100 ohm from node N (420,120) to local ground -->
    <line x1="420" y1="120" x2="420" y2="140"/>
    <polyline points="420,140 432,145 408,155 432,165 408,175 432,185 420,190"/>
    <line x1="420" y1="190" x2="420" y2="210"/>
    <line x1="404" y1="210" x2="436" y2="210"/>
    <line x1="410" y1="216" x2="430" y2="216"/>
    <line x1="416" y1="222" x2="424" y2="222"/>

    <!-- PTT: IO19 -> R3 33k -> node B -->
    <line x1="230" y1="290" x2="400" y2="290"/>
    <polyline points="400,290 405,278 415,302 425,278 435,302 445,278 455,302 460,290"/>
    <line x1="460" y1="290" x2="580" y2="290"/>
    <line x1="580" y1="290" x2="580" y2="200"/>

    <!-- RX audio: SP -> C2 1uF -> LINE IN, C3 1000pF to GND -->
    <line x1="700" y1="400" x2="572" y2="400"/>
    <line x1="572" y1="382" x2="572" y2="418"/>
    <line x1="560" y1="382" x2="560" y2="418"/>
    <line x1="560" y1="400" x2="230" y2="400"/>
    <line x1="430" y1="400" x2="430" y2="439"/>
    <line x1="410" y1="439" x2="450" y2="439"/>
    <line x1="410" y1="451" x2="450" y2="451"/>
    <line x1="430" y1="451" x2="430" y2="490"/>

    <!-- GND -->
    <line x1="230" y1="490" x2="700" y2="490"/>
  </g>

  <g fill="#111">
    <circle cx="420" cy="120" r="4"/>
    <circle cx="580" cy="200" r="4"/>
    <circle cx="430" cy="400" r="4"/>
    <circle cx="430" cy="490" r="4"/>
  </g>

  <!-- part labels -->
  <text x="320" y="98" text-anchor="middle" fill="#b00">R1 10kΩ</text>
  <text x="440" y="170" fill="#b00">R2 100Ω</text>
  <text x="506" y="92" text-anchor="middle" fill="#b00">C1 1µF</text>
  <text x="430" y="270" text-anchor="middle" fill="#b00">R3 33kΩ</text>
  <text x="566" y="372" text-anchor="middle" fill="#b00">C2 1µF</text>
  <text x="460" y="450" fill="#b00">C3 1000pF (102)</text>

  <!-- notes -->
  <g font-size="14" fill="#222">
    <text x="20" y="556" font-weight="bold">動作</text>
    <text x="20" y="578">・送信: IO19 = LOW(オープンドレイン)→ R3 で MIC/PTT 線を GND へ(ICOM は 33kΩ 前後で PTT)</text>
    <text x="20" y="600">・受信: IO19 は開放(ハイインピーダンス)。無線機へ 3.3V はかからない</text>
    <text x="20" y="622">・送信音声: R1/R2 で約 1/100(−40dB)に減衰 → C1 で DC カット → MIC/PTT 線へ</text>
    <text x="20" y="644">・受信音声: ID-31 SP → C2 で DC カット → LINE IN。C3 は RF 除去。送信表示は緑 LED(GPIO22)</text>
    <text x="20" y="674" font-weight="bold">部品・調整</text>
    <text x="20" y="696">・C1, C2: 1µF(フィルム or 積層セラミック。電解なら C1 は + を ID-31 側、C2 は + を AudioKit 側)</text>
    <text x="20" y="718">・送信音が小さい → R2 を 220Ω に / 大きい → 47Ω に。細かくは txgain・outvol で調整</text>
    <text x="20" y="740">・受信音量は ID-31 の音量と rxgain で調整(meter で −20〜−6 dBFS 程度が目安)</text>
    <text x="20" y="762">・ID-31 側ジャックのピン配置は取扱説明書で確認。AudioKit 側はプラグの Tip(L)を使用</text>
    <text x="20" y="784">・ハムが出る場合は音声線に 600:600Ω トランスを入れて絶縁</text>
  </g>
</svg>
