<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="15">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">BT-PTT ⇔ ID-31 プラグ結線図(接点ごと)</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#444">左: AudioKit 側に挿すプラグ ／ 右: ID-31 側に挿すプラグ(2 本ピン型: 3.5mm=SP、2.5mm=MIC、ピン間隔 10mm)</text>

  <!-- ===== Cable 1: TX audio + PTT ===== -->
  <text x="40" y="96" font-size="17" font-weight="bold" fill="#225">① 送信ケーブル(マイク音声 + PTT)</text>

  <!-- AudioKit EARPHONES plug -->
  <rect x="40" y="110" width="200" height="150" rx="6" fill="#eef4ff" stroke="#3366aa" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#224">AudioKit「EARPHONES」へ</text>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#224">3.5mm ステレオプラグ</text>
  <text x="228" y="175" text-anchor="end" fill="#111">Tip(L)</text>
  <text x="228" y="215" text-anchor="end" fill="#999">Ring(R) 未接続</text>
  <text x="228" y="250" text-anchor="end" fill="#111">Sleeve(GND)</text>

  <!-- AudioKit header -->
  <rect x="40" y="300" width="200" height="80" rx="6" fill="#eef4ff" stroke="#3366aa" stroke-width="2"/>
  <text x="140" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#224">AudioKit 2×7 ヘッダ</text>
  <text x="228" y="355" text-anchor="end" fill="#111">IO19(左列 3 番目)</text>

  <!-- ID-31 MIC plug -->
  <rect x="760" y="110" width="200" height="150" rx="6" fill="#fff4ea" stroke="#aa6633" stroke-width="2"/>
  <text x="860" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#422">ID-31「MIC」へ</text>
  <text x="860" y="146" text-anchor="middle" font-size="12" fill="#422">2.5mm プラグ</text>
  <text x="772" y="195" fill="#111">Tip(MIC/PTT)</text>
  <text x="772" y="225" fill="#999">Ring 未接続</text>
  <text x="772" y="250" fill="#111">Sleeve(GND)</text>

  <g stroke="#111" stroke-width="2" fill="none">
    <!-- Tip(L) -> R1 -> N -> C1 -> MIC tip -->
    <line x1="240" y1="170" x2="290" y2="170"/>
    <polyline points="290,170 295,158 305,182 315,158 325,182 335,158 345,182 350,170"/>
    <line x1="350" y1="170" x2="520" y2="170"/>
    <line x1="520" y1="152" x2="520" y2="188"/>
    <line x1="532" y1="152" x2="532" y2="188"/>
    <line x1="532" y1="170" x2="640" y2="170"/>
    <line x1="640" y1="170" x2="640" y2="190"/>
    <line x1="640" y1="190" x2="760" y2="190"/>
    <!-- R2 from N to GND line -->
    <line x1="420" y1="170" x2="420" y2="185"/>
    <polyline points="420,185 430,189 410,197 430,205 410,213 430,221 420,225"/>
    <line x1="420" y1="225" x2="420" y2="245"/>
    <!-- GND: sleeve to sleeve -->
    <line x1="240" y1="245" x2="760" y2="245"/>
    <!-- PTT: IO19 -> R3 -> MIC tip -->
    <line x1="240" y1="350" x2="440" y2="350"/>
    <polyline points="440,350 445,338 455,362 465,338 475,362 485,338 495,362 500,350"/>
    <line x1="500" y1="350" x2="640" y2="350"/>
    <line x1="640" y1="350" x2="640" y2="190"/>
  </g>
  <g fill="#111">
    <circle cx="420" cy="170" r="4"/><circle cx="420" cy="245" r="4"/><circle cx="640" cy="190" r="4"/>
  </g>
  <g fill="#b00" font-size="14">
    <text x="320" y="150" text-anchor="middle">R1 10kΩ</text>
    <text x="436" y="210">R2 100Ω</text>
    <text x="526" y="145" text-anchor="middle">C1 1µF</text>
    <text x="470" y="330" text-anchor="middle">R3 33kΩ</text>
  </g>
  <text x="648" y="290" font-size="13" fill="#225">マイク線(1 芯シールド):</text>
  <text x="648" y="308" font-size="13" fill="#225">芯線 = 2.5mm Tip ／ シールド = Sleeve</text>

  <!-- ===== Cable 2: RX audio ===== -->
  <text x="40" y="440" font-size="17" font-weight="bold" fill="#225">② 受信ケーブル(スピーカー音声)</text>

  <rect x="40" y="455" width="200" height="140" rx="6" fill="#eef4ff" stroke="#3366aa" stroke-width="2"/>
  <text x="140" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#224">AudioKit「LINE IN」へ</text>
  <text x="140" y="491" text-anchor="middle" font-size="12" fill="#224">3.5mm ステレオプラグ</text>
  <text x="228" y="520" text-anchor="end" fill="#111">Tip(L)</text>
  <text x="228" y="555" text-anchor="end" fill="#999">Ring(R) 未接続</text>
  <text x="228" y="585" text-anchor="end" fill="#111">Sleeve(GND)</text>

  <rect x="760" y="455" width="200" height="140" rx="6" fill="#fff4ea" stroke="#aa6633" stroke-width="2"/>
  <text x="860" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#422">ID-31「SP」へ</text>
  <text x="860" y="491" text-anchor="middle" font-size="12" fill="#422">3.5mm プラグ</text>
  <text x="772" y="520" fill="#111">Tip(SP)</text>
  <text x="772" y="555" fill="#999">Ring 未接続</text>
  <text x="772" y="585" fill="#111">Sleeve(GND)</text>

  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="760" y1="515" x2="572" y2="515"/>
    <line x1="572" y1="497" x2="572" y2="533"/>
    <line x1="560" y1="497" x2="560" y2="533"/>
    <line x1="560" y1="515" x2="240" y2="515"/>
    <line x1="400" y1="515" x2="400" y2="544"/>
    <line x1="380" y1="544" x2="420" y2="544"/>
    <line x1="380" y1="556" x2="420" y2="556"/>
    <line x1="400" y1="556" x2="400" y2="580"/>
    <line x1="240" y1="580" x2="760" y2="580"/>
  </g>
  <g fill="#111"><circle cx="400" cy="515" r="4"/><circle cx="400" cy="580" r="4"/></g>
  <g fill="#b00" font-size="14">
    <text x="566" y="490" text-anchor="middle">C2 1µF</text>
    <text x="430" y="553">C3 1000pF (102)</text>
  </g>
  <text x="560" y="620" font-size="13" fill="#225">音声線(2 本 or 1 芯シールド): Tip どうし ／ Sleeve どうし</text>

  <!-- ===== notes ===== -->
  <g font-size="14" fill="#222">
    <text x="40" y="668" font-weight="bold">結線のポイント</text>
    <text x="40" y="692">・ID-31 の 2.5mm(MIC)Tip にマイク音声と PTT が同居。C1 の出力と R3 は同じ Tip に接続する</text>
    <text x="40" y="714">・Ring はすべて未接続(AudioKit 側は R チャンネル、ID-31 側は機種によりデータ/電源のため触らない)</text>
    <text x="40" y="736">・GND は ①② の Sleeve どうしで共通になるので、ヘッダの GND への配線は不要</text>
    <text x="40" y="758">・部品(R1・R2・C1・R3、C2・C3)は AudioKit 側プラグの近く(小基板やケーブル途中)にまとめると扱いやすい</text>
    <text x="40" y="788" font-weight="bold">確認と調整</text>
    <text x="40" y="812">・配線前にテスターで確認: ID-31 電源 ON で 2.5mm の Tip–Sleeve 間に DC 電圧(マイクバイアス)が出ていること</text>
    <text x="40" y="834">・PTT が入らないときは R3 を下げる(33kΩ → 10kΩ → 3.9kΩ。市販インターフェースの例は 3.9kΩ)</text>
    <text x="40" y="856">・電解コンデンサを使う場合: C1 は + を ID-31 側、C2 は + を AudioKit 側</text>
    <text x="40" y="878">・送信音量は R2(小さい→220Ω / 大きい→47Ω)と txgain・outvol、受信音量は ID-31 の音量と rxgain で調整</text>
    <text x="40" y="908" font-size="12" fill="#666">ピン配置の出典: ICOM 2 本ピン型ハンディ機(IC-T70A 等、ID-31E も同形状)の結線例。ID-31 取扱説明書の外部端子の項でも確認してください。</text>
  </g>
</svg>
